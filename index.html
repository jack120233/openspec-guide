<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f8f7">
  <meta name="description" content="基于 OpenSpec v2.1.0 官方文档的中文交互学习手册：学习路线、12 个 Skills、工作流实验室、命令速查与团队实践。">
  <title>OpenSpec 学习手册</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="assets/lucide.min.js" defer></script>
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <div class="sidebar-scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar" aria-label="主导航">
    <a class="brand" href="#roadmap" aria-label="OpenSpec 学习手册首页">
      <span class="brand-mark"><i data-lucide="blocks"></i></span>
      <span><strong>OpenSpec<span class="brand-dot">.</span></strong><small>规范驱动开发 · 学习手册</small></span>
    </a>
    <div class="edition"><span class="live-dot"></span> FIELD GUIDE <span>2026 EDITION</span></div>
    <div class="nav-heading">学习工作台</div>
    <nav id="nav"></nav>
    <div class="sidebar-progress">
      <div><span>你的学习进度</span><strong id="side-progress">0 / 6</strong></div>
      <div class="progress-track"><span id="progress-fill"></span></div>
      <p id="progress-caption">从第一个小变更开始</p>
    </div>
    <div class="sidebar-bottom">
      <a href="https://github.com/Fission-AI/OpenSpec" target="_blank" rel="noopener noreferrer"><i data-lucide="github"></i> 官方仓库 <i data-lucide="arrow-up-right"></i></a>
      <div><span class="version">v2.1.0</span><span>核对于 2026.11.17</span></div>
    </div>
  </aside>
  <div class="workspace">
    <header class="topbar">
      <div class="breadcrumb"><button class="icon-button mobile-menu" id="menu-toggle" aria-label="打开导航" title="打开导航" aria-controls="sidebar" aria-expanded="false"><i data-lucide="menu"></i></button><span>学习手册</span><i data-lucide="chevron-right"></i><strong id="breadcrumb-current">学习路线</strong></div>
      <div class="topbar-actions">
        <button class="search-trigger" id="search-trigger" aria-label="搜索教程" title="搜索教程"><i data-lucide="search"></i><span>搜索主题、命令…</span></button>
        <button class="icon-button" id="export-progress" aria-label="导出学习记录" title="导出学习记录"><i data-lucide="download"></i></button>
        <a class="icon-button" href="https://openspec.dev/docs/quickstart" target="_blank" rel="noopener noreferrer" title="官方文档" aria-label="打开官方文档"><i data-lucide="book-open"></i></a>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="page-footer"><span>独立中文学习手册 · 非官方产品</span><span>基于 v2.1.0 · <a href="#sources">来源与版本说明 <i data-lucide="arrow-up-right"></i></a></span></footer>
  </div>
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"><div id="detail-content"></div></dialog>
  <dialog id="search-dialog" class="search-dialog" aria-label="搜索教程">
    <div class="search-box"><i data-lucide="search"></i><input id="search-input" type="search" placeholder="主题、命令、问题…" aria-label="搜索主题或命令"><button class="icon-button" data-action="close-search" aria-label="关闭搜索" title="关闭"><i data-lucide="x"></i></button></div>
    <div id="search-results" class="search-results"></div>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
